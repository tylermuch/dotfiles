set -g @plugin 'tmux-plugins/tpm'          # prefix + I to install plugins
set -g @plugin 'tmux-plugins/tmux-copycat' # prefix + / to search using regex
                                           # prefix + C-f to search for file paths
                                           # prefix + C-g to search for file paths in git status output
set -g @plugin 'tmux-plugins/tmux-logging' # prefix + shift + p to toggle logging
                                           # prefix + alt + shift + p to save buffer to file
set -g @plugin 'tmux-plugins/tmux-open'    # 'o' in copy mode opens a selected file path
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'alexforsythe/tmux-which-key'

bind -n F1 run-shell "$HOME/.tmux/plugins/tmux-logging/scripts/toggle_logging.sh"
bind -n F2 run-shell "$HOME/.tmux/plugins/tmux-logging/scripts/screen_capture.sh"
bind -n F3 run-shell "$HOME/.tmux/plugins/tmux-logging/scripts/save_complete_history.sh"

bind Right swap-window -t +1
bind Left swap-window -t -1

# Press Space to begin a selection
# Press 'y' to copy selection to system clipboard
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'

# Mouse scrolling
set -g mouse on

# Buffer history
set -g history-limit 100000

# When viewing the same session on multiple screens, don't limit our screen size to the smallest of all session viewers
setw -g aggressive-resize on

# Index windows at panes beginning at 1 instead of 0.
# This makes it easier to address windows with prefix+#, for instance
set -g base-index 1
set -g pane-base-index 1

# Rename window to reflect current path and program
set -g automatic-rename on
set -g automatic-rename-format "#{window_icon} "

# Set terminal title
set -g set-titles on

# Re-number windows sequentially after closing any of them
# instead of leaving a gap in the window indices
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# address vim mode switching delay
set -s escape-time 0

# focus events enabled for terminals that support them
set -g focus-events on

# tmux messages are displayed for 4 seconds
set -g display-time 4000

# refresh 'status-left' and 'status-right' every 1 second
set -g status-interval 1

# status bar formatting
set -g mode-style "fg=#c4b28a,bg=#282727"
set -g message-style "fg=#c4b28a,bg=#181616"
set -g message-command-style "fg=#c4b28a,bg=#181616"
set -g pane-border-style "fg=#625e5a"
set -g pane-active-border-style "fg=#7fb4ca"
set -g pane-border-lines heavy
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#c4b28a,bg=#181616"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#181616,bg=#c4b28a,bold] #{b:session_name} #[fg=#c4b28a,bg=#181616,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#181616,bg=#181616,nobold,nounderscore,noitalics]#[fg=#c4b28a,bg=#181616] #{prefix_highlight} #[fg=#282727,bg=#181616,nobold,nounderscore,noitalics]#[fg=#c4b28a,bg=#282727] %m-%d / %-I:%M %Z #[fg=#c4b28a,bg=#282727,nobold,nounderscore,noitalics]#[fg=#181616,bg=#c4b28a,bold] #{b:host} "
setw -g window-status-activity-style "underscore,fg=#625e5a,bg=#181616"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#625e5a,bg=#181616"
setw -g window-status-format "#[fg=#181616,bg=#181616,nobold,nounderscore,noitalics]#[default] #{b:window_index} #{b:window_name}#[fg=#181616,bg=#181616,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#181616,bg=#282727,nobold,nounderscore,noitalics]#[fg=#c4b28a,bg=#282727,bold] #{b:window_index} #{b:window_name}#[fg=#282727,bg=#181616,nobold,nounderscore,noitalics]"

# ===========================================
# tmux-shortcut-helper: zellij-style config
# ===========================================

# Two status lines: status-format[0] is the main bar (session, windows, clock),
# status-format[1] below it is the shortcut helper bar.
# status-format[0] is pinned to tmux's stock default since enabling status 2 changes it.
set -g status 2
set -g 'status-format[1]' '#[fg=#c4b28a,bg=#181616,align=centre]#(tmux-shortcut-helper --mode-status idle)'
set -g 'status-format[0]' "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# --- PANE mode (Ctrl+p) ---
bind -n C-p set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status pane)' \; switch-client -T pane-mode
bind -T pane-mode h select-pane -L \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T pane-mode j select-pane -D \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T pane-mode k select-pane -U \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T pane-mode l select-pane -R \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T pane-mode n split-window -h -c "#{pane_current_path}" \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T pane-mode d split-window -v -c "#{pane_current_path}" \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T pane-mode x confirm-before -p "Close pane? (y/n)" kill-pane \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T pane-mode f resize-pane -Z \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T pane-mode b break-pane \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T pane-mode J command-prompt -p "Join from window (number or name):" "join-pane -s ':%%'" \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T pane-mode Escape set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T pane-mode Enter set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T pane-mode q set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root

# --- TAB mode (Ctrl+e) ---
bind -n C-e set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status tab)' \; switch-client -T tab-mode
bind -T tab-mode n new-window -c "#{pane_current_path}" \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T tab-mode x confirm-before -p "Close tab? (y/n)" kill-window \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T tab-mode r command-prompt -I "#W" "rename-window '%%'" \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T tab-mode h previous-window \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T tab-mode l next-window \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T tab-mode 1 select-window -t 1 \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T tab-mode 2 select-window -t 2 \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T tab-mode 3 select-window -t 3 \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T tab-mode 4 select-window -t 4 \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T tab-mode 5 select-window -t 5 \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T tab-mode Escape set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T tab-mode Enter set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T tab-mode q set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root

# --- RESIZE mode (Ctrl+x) ---
bind -n C-x set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status resize)' \; switch-client -T resize-mode
bind -T resize-mode h resize-pane -L 5 \; switch-client -T resize-mode
bind -T resize-mode j resize-pane -D 5 \; switch-client -T resize-mode
bind -T resize-mode k resize-pane -U 5 \; switch-client -T resize-mode
bind -T resize-mode l resize-pane -R 5 \; switch-client -T resize-mode
bind -T resize-mode Escape set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T resize-mode Enter set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T resize-mode q set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root

# --- Pane navigation (direct Ctrl+hjkl, no mode required) ---
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R
bind -n C-n select-pane -t :.+

# --- SESSION mode (Ctrl+s) ---
bind -n C-s set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status session)' \; switch-client -T session-mode
bind -T session-mode d detach-client \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T session-mode w choose-tree -Zs \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T session-mode r command-prompt -I "#S" "rename-session '%%'" \; set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T session-mode Escape set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T session-mode Enter set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root
bind -T session-mode q set -g 'status-format[1]' '#[align=centre]#(tmux-shortcut-helper --mode-status idle)' \; switch-client -T root

# --- SEARCH mode removed (Ctrl+s is now SESSION) ---

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run 'PATH="/opt/homebrew/opt/coreutils/libexec/gnubin:$PATH" ~/.tmux/plugins/tpm/tpm'

